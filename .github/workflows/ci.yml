name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

  lint:
    name: ESLint (Zero Warnings)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  tests:
    name: Automated Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

  simulation-integrity:
    name: Simulation Test Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Reject placeholder assertions in simulation suites
        run: node scripts/check-test-integrity.mjs

  numerical-reference:
    name: Numerical Reference & Sandbox Physics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run sandbox numerical suites
        run: node --experimental-strip-types --test src/simulation/tests/*.test.ts

      - name: Fuzz the swept-sphere collision detector
        run: node --experimental-strip-types scripts/collision-fuzz.mjs --solver-cases 20000 --world-cases 200

      - name: Measure the simulation benchmark matrix
        run: node --experimental-strip-types scripts/sim-benchmark.mjs --steps 40

  assets:
    name: Vector Assets & Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate vector assets & manifest
        run: node scripts/validate-assets.mjs

  docs:
    name: Documentation Consistency & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check documentation consistency
        run: node scripts/check-doc-consistency.mjs

  build:
    name: Production Bundle Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile production build
        run: npm run build

  sandbox-browser:
    name: Sandbox Browser Acceptance
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8081/ > /dev/null 2>&1; then
              echo "Preview server ready on :8081"
              break
            fi
            sleep 1
          done

      - name: Run simulation sandbox browser acceptance
        run: xvfb-run --auto-servernum -- node scripts/browser-sandbox.mjs http://127.0.0.1:8081/sandbox

  browser-smoke:
    name: Headless Browser Smoke QA
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8081/ > /dev/null 2>&1; then
              echo "Preview server ready on :8081"
              break
            fi
            sleep 1
          done

      - name: Run browser smoke tests on production preview
        run: xvfb-run --auto-servernum -- node scripts/browser-smoke.mjs http://127.0.0.1:8081/ screenshots/app-builder-preview.png

      - name: Run browser interaction tests on production preview
        run: xvfb-run --auto-servernum -- node scripts/browser-interaction.mjs http://127.0.0.1:8081/
