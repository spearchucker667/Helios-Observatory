name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & Verification Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint (Zero Warnings)
        run: npm run lint

      - name: Run automated test suite
        run: npm test

      - name: Validate vector assets & manifest
        run: node scripts/validate-assets.mjs

      - name: Check documentation consistency
        run: node scripts/check-doc-consistency.mjs

      - name: Compile production build
        run: npm run build

  browser-smoke:
    name: Headless Browser Smoke QA
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: xvfb-run --auto-servernum -- node scripts/browser-smoke.mjs
