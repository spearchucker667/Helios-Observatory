<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="epoch-icon-title">
  <title id="epoch-icon-title">Helios Epoch Clock Icon</title>
  <rect width="48" height="48" rx="10" fill="#0c1017"/>
  <circle cx="24" cy="24" r="16" fill="none" stroke="#e0e7ff" stroke-width="2.5" stroke-opacity="0.85"/>
  <!-- Clock hands set to epoch J2000 12:00 TT -->
  <line x1="24" y1="24" x2="24" y2="14" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="31" y2="24" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="24" r="2.5" fill="#c7d2fe"/>
  <!-- Small celestial marker at 12 o'clock -->
  <circle cx="24" cy="11" r="1.5" fill="#fbbf24"/>
</svg>
