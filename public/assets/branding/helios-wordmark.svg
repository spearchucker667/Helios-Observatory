<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-labelledby="wordmark-title wordmark-desc">
  <title id="wordmark-title">Helios Observatory Wordmark</title>
  <desc id="wordmark-desc">Official vector wordmark with radiant gold celestial orbit icon and crisp modern typography.</desc>
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#ff9d3b"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
  </defs>
  <g transform="translate(10, 10)">
    <!-- Central star symbol -->
    <circle cx="30" cy="30" r="10" fill="url(#orbitGrad)"/>
    <ellipse cx="30" cy="30" rx="26" ry="10" fill="none" stroke="#ffd56b" stroke-width="1.75" stroke-opacity="0.8" transform="rotate(-25 30 30)"/>
    <circle cx="51" cy="20" r="3" fill="#ffffff"/>
  </g>
  <text x="80" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="#f4f5f8" letter-spacing="-0.5">Helios</text>
  <text x="82" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#9da3af" letter-spacing="3.5">OBSERVATORY</text>
</svg>
